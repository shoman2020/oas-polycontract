asyncapi: 3.1.0
info:
  title: Product Availability Kafka API
  version: 1.0.0
  description: Contract example for product availability events published to Kafka.
  tags:
    - name: products
      description: Product availability events.
  contact:
    name: SHIFT-LEFT.NL and Ahmed Abdelwahab
    url: https://shift-left.nl
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  local:
    host: localhost:9092
    protocol: kafka
    protocolVersion: "3.7.0"
    description: Local development broker (example contract; no broker is included).
defaultContentType: application/json
channels:
  productAvailability:
    address: products.availability
    messages:
      availabilityChanged:
        $ref: "#/components/messages/AvailabilityChanged"
operations:
  publishAvailabilityChanged:
    action: send
    channel:
      $ref: "#/channels/productAvailability"
    summary: Publish an availability update.
    description: Publishes an availability update to the products.availability topic.
    messages:
      - $ref: "#/channels/productAvailability/messages/availabilityChanged"
components:
  messages:
    AvailabilityChanged:
      name: AvailabilityChanged
      title: Product availability changed
      payload:
        $ref: "#/components/schemas/Availability"
  schemas:
    Availability:
      type: object
      required: [sku, available, updatedAt]
      properties:
        sku:
          type: string
        available:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time

