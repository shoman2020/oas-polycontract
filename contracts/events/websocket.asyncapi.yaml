asyncapi: 3.1.0
info:
  title: Product Availability WebSocket API
  version: 1.0.0
  description: Contract example for real-time product availability updates over WebSocket.
  contact:
    name: SHIFT-LEFT.NL and Ahmed Abdelwahab
    url: https://shift-left.nl
  license:
    name: MIT
    url: https://opensource.org/license/mit
tags:
  - name: products
    description: Product availability events.
servers:
  local:
    host: localhost:8083
    protocol: ws
    description: Local development endpoint (example contract; no server is included).
defaultContentType: application/json
channels:
  productAvailability:
    address: /products/{sku}/availability
    parameters:
      sku:
        description: Product SKU to subscribe to.
        schema:
          type: string
    messages:
      availabilityChanged:
        $ref: "#/components/messages/AvailabilityChanged"
operations:
  publishAvailabilityUpdates:
    action: send
    channel:
      $ref: "#/channels/productAvailability"
    summary: Publish availability updates for one product.
    description: Publishes an availability update for subscribers to the product channel.
    messages:
      - $ref: "#/channels/productAvailability/messages/availabilityChanged"
components:
  messages:
    AvailabilityChanged:
      name: AvailabilityChanged
      title: Product availability changed
      payload:
        $ref: "#/components/schemas/Availability"
  schemas:
    Availability:
      type: object
      required: [sku, available, updatedAt]
      properties:
        sku:
          type: string
        available:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time

