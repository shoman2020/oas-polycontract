openapi: 3.0.3
info:
  title: Product Catalog API
  version: 1.0.0
  description: >
    Design scaffold for the Product Catalog API. This reviewed contract
    is checked by Spectral and oasdiff. No provider implements it yet; the runnable demo has
    a separate contract at demo/openapi.yaml.
  contact:
    name: SHIFT-LEFT.NL and Ahmed Abdelwahab
    url: https://shift-left.nl
servers:
  - url: http://localhost:8080
    description: Local / CI
tags:
  - name: health
    description: Service availability.
  - name: products
    description: Product catalog operations.
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness check
      description: Returns the current health status of the Product Catalog API.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: List products
      description: Returns a page of products using the supplied pagination values.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
    post:
      tags: [products]
      operationId: createProduct
      summary: Create a product
      description: Creates a product from the supplied product details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProduct"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: The request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /products/{sku}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Get a product by SKU
      description: Returns the product identified by its stock keeping unit.
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
          example: demo-sku
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: No product exists for that SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Product:
      type: object
      required: [sku, name, available]
      properties:
        sku:
          type: string
        name:
          type: string
        available:
          type: integer
          minimum: 0
    NewProduct:
      type: object
      required: [sku, name]
      properties:
        sku:
          type: string
        name:
          type: string
        available:
          type: integer
          minimum: 0
          default: 0
    ProductPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
          minimum: 0
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
