services:
  wiremock:
    image: oas-polycontract-wiremock:latest
    build:
      context: ./demo/wiremock
      args:
        WIREMOCK_VERSION: ${WIREMOCK_VERSION:?Set WIREMOCK_VERSION in .github/versions.env}
    command: ["--global-response-templating"]
    ports:
      - "8081:8080"
    volumes:
      - ./demo/downstream/wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  app:
    build:
      context: ./demo/app
      args:
        NODE_VERSION: ${NODE_VERSION:?Set NODE_VERSION in .github/versions.env}
    environment:
      INVENTORY_URL: http://wiremock:8080
      PORT: "8080"
    depends_on:
      wiremock:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  wiremock-integration-test:
    build:
      context: ./demo/app
      args:
        NODE_VERSION: ${NODE_VERSION:?Set NODE_VERSION in .github/versions.env}
    command: ["node", "tests/wiremock.integration.mjs"]
    environment:
      APP_URL: http://app:8080
      WIREMOCK_URL: http://wiremock:8080
    depends_on:
      app:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    profiles: [test]

  specmatic-provider:
    image: specmatic/specmatic:${SPECMATIC_VERSION:?Set SPECMATIC_VERSION in .github/versions.env}
    working_dir: /usr/src/app
    command: ["test", "openapi.yaml", "--testBaseURL=http://app:8080"]
    volumes:
      - ./demo:/usr/src/app
    depends_on:
      app:
        condition: service_healthy
    profiles: [test]

  specmatic-examples-validate:
    image: specmatic/specmatic:${SPECMATIC_VERSION:?Set SPECMATIC_VERSION in .github/versions.env}
    working_dir: /usr/src/app
    command: ["examples", "validate", "--spec-file", "openapi.yaml"]
    volumes:
      - ./demo:/usr/src/app
    profiles: [test]

  specmatic-downstream:
    image: specmatic/specmatic:${SPECMATIC_VERSION:?Set SPECMATIC_VERSION in .github/versions.env}
    working_dir: /usr/src/app
    command: ["test", "openapi.yaml", "--testBaseURL=http://wiremock:8080"]
    volumes:
      - ./demo/downstream:/usr/src/app
    depends_on:
      wiremock:
        condition: service_healthy
    profiles: [test]

  specmatic-mock:
    image: specmatic/specmatic:${SPECMATIC_VERSION:?Set SPECMATIC_VERSION in .github/versions.env}
    working_dir: /usr/src/app
    command: ["mock", "openapi.yaml"]
    volumes:
      - ./demo:/usr/src/app
    ports:
      - "9000:9000"
    profiles: [mock]

  specmatic-mock-integration-test:
    build:
      context: ./demo/app
      args:
        NODE_VERSION: ${NODE_VERSION:?Set NODE_VERSION in .github/versions.env}
    command: ["node", "tests/specmatic-mock.integration.mjs"]
    environment:
      MOCK_URL: http://specmatic-mock:9000
    depends_on:
      specmatic-mock:
        condition: service_started
    profiles: [test]

  spectral:
    image: stoplight/spectral:${SPECTRAL_VERSION:?Set SPECTRAL_VERSION in .github/versions.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        spectral lint --ruleset /repo/gates/lint/.spectral.yaml
        /repo/openapi/openapi.yaml
        /repo/demo/openapi.yaml
        /repo/demo/downstream/openapi.yaml
    volumes:
      - ./:/repo:ro
    profiles: [test]

  spectral-asyncapi:
    image: stoplight/spectral:${SPECTRAL_VERSION:?Set SPECTRAL_VERSION in .github/versions.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        spectral lint --ruleset /repo/gates/lint/.spectral-asyncapi.yaml
        /repo/contracts/events/websocket.asyncapi.yaml
        /repo/contracts/events/kafka.asyncapi.yaml
    volumes:
      - ./:/repo:ro
    profiles: [test]

  oasdiff:
    image: tufin/oasdiff:v${OASDIFF_VERSION:?Set OASDIFF_VERSION in .github/versions.env}
    command: ["breaking", "/repo/openapi/openapi.base.yaml", "/repo/openapi/openapi.yaml"]
    volumes:
      - ./:/repo:ro
    profiles: [test]

  schemathesis:
    image: schemathesis/schemathesis:v${SCHEMATHESIS_VERSION:?Set SCHEMATHESIS_VERSION in .github/versions.env}
    command: ["run", "/contracts/openapi.yaml", "--url=http://app:8080"]
    volumes:
      - ./demo:/contracts:ro
    depends_on:
      app:
        condition: service_healthy
    profiles: [test]

  rust-contract-test:
    build:
      context: ./clients/rust
      args:
        RUST_VERSION: ${RUST_VERSION:?Set RUST_VERSION in .github/versions.env}
    environment:
      API_BASE_URL: http://app:8080
      OPENAPI_SPEC: /contracts/openapi.yaml
    volumes:
      - ./demo:/contracts:ro
    depends_on:
      app:
        condition: service_healthy
    profiles: [test]

  go-contract-test:
    build:
      context: ./clients/go
      args:
        GO_VERSION: ${GO_VERSION:?Set GO_VERSION in .github/versions.env}
    environment:
      API_BASE_URL: http://app:8080
      OPENAPI_SPEC: /contracts/openapi.yaml
    volumes:
      - ./demo:/contracts:ro
    depends_on:
      app:
        condition: service_healthy
    profiles: [test]

  python-contract-test:
    build:
      context: ./clients/python
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:?Set PYTHON_VERSION in .github/versions.env}
    environment:
      API_BASE_URL: http://app:8080
      OPENAPI_SPEC: /contracts/openapi.yaml
    volumes:
      - ./demo:/contracts:ro
    depends_on:
      app:
        condition: service_healthy
    profiles: [test]

  js-contract-test:
    build:
      context: ./clients/js
      args:
        NODE_VERSION: ${NODE_VERSION:?Set NODE_VERSION in .github/versions.env}
    environment:
      API_BASE_URL: http://app:8080
      OPENAPI_SPEC: /contracts/openapi.yaml
    volumes:
      - ./demo:/contracts:ro
    depends_on:
      app:
        condition: service_healthy
    profiles: [test]

  ts-contract-test:
    build:
      context: ./clients/ts
      args:
        NODE_VERSION: ${NODE_VERSION:?Set NODE_VERSION in .github/versions.env}
    environment:
      API_BASE_URL: http://app:8080
      OPENAPI_SPEC: /contracts/openapi.yaml
    volumes:
      - ./demo:/contracts:ro
    depends_on:
      app:
        condition: service_healthy
    profiles: [test]

  java-contract-test:
    build:
      context: ./clients/java
      args:
        JAVA_VERSION: ${JAVA_VERSION:?Set JAVA_VERSION in .github/versions.env}
        MAVEN_VERSION: ${MAVEN_VERSION:?Set MAVEN_VERSION in .github/versions.env}
    environment:
      API_BASE_URL: http://app:8080
      OPENAPI_SPEC: /contracts/openapi.yaml
    volumes:
      - ./demo:/contracts:ro
    depends_on:
      app:
        condition: service_healthy
    profiles: [test]

  csharp-contract-test:
    build:
      context: ./clients/csharp
      args:
        DOTNET_VERSION: ${DOTNET_VERSION:?Set DOTNET_VERSION in .github/versions.env}
    environment:
      API_BASE_URL: http://app:8080
      OPENAPI_SPEC: /contracts/openapi.yaml
    volumes:
      - ./demo:/contracts:ro
    depends_on:
      app:
        condition: service_healthy
    profiles: [test]

  swagger-ui:
    image: swaggerapi/swagger-ui:${SWAGGER_UI_VERSION:?Set SWAGGER_UI_VERSION in .github/versions.env}
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    ports:
      - "8082:8080"
    volumes:
      - ./openapi:/spec:ro
    profiles: [debug]

  prism-mock:
    image: stoplight/prism:${PRISM_VERSION:?Set PRISM_VERSION in .github/versions.env}
    command: ["mock", "-h", "0.0.0.0", "/spec/openapi.yaml"]
    ports:
      - "4010:4010"
    volumes:
      - ./openapi:/spec:ro
    profiles: [debug]
