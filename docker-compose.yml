services:
  wiremock:
    image: oas-polycontract-wiremock:latest
    build:
      context: ./demo/wiremock
    command: ["--global-response-templating"]
    ports:
      - "8081:8080"
    volumes:
      - ./demo/downstream/wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  app:
    build:
      context: ./demo/app
    environment:
      INVENTORY_URL: http://wiremock:8080
      PORT: "8080"
    depends_on:
      wiremock:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  wiremock-integration-test:
    build:
      context: ./demo/app
    command: ["node", "tests/wiremock.integration.mjs"]
    environment:
      APP_URL: http://app:8080
      WIREMOCK_URL: http://wiremock:8080
    depends_on:
      app:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    profiles: [test]

  specmatic-provider:
    image: specmatic/specmatic:2.56.3
    working_dir: /usr/src/app
    command: ["test", "openapi.yaml", "--testBaseURL=http://app:8080"]
    volumes:
      - ./demo:/usr/src/app
    depends_on:
      app:
        condition: service_healthy
    profiles: [test]

  specmatic-examples-validate:
    image: specmatic/specmatic:2.56.3
    working_dir: /usr/src/app
    command: ["examples", "validate", "--spec-file", "openapi.yaml"]
    volumes:
      - ./demo:/usr/src/app
    profiles: [test]

  specmatic-downstream:
    image: specmatic/specmatic:2.56.3
    working_dir: /usr/src/app
    command: ["test", "openapi.yaml", "--testBaseURL=http://wiremock:8080"]
    volumes:
      - ./demo/downstream:/usr/src/app
    depends_on:
      wiremock:
        condition: service_healthy
    profiles: [test]

  specmatic-mock:
    image: specmatic/specmatic:2.56.3
    working_dir: /usr/src/app
    command: ["mock", "openapi.yaml"]
    volumes:
      - ./demo:/usr/src/app
    ports:
      - "9000:9000"
    profiles: [mock]
