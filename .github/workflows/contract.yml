name: contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-examples:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: bash -n run.sh

      - name: Load pinned scanner version
        run: |
          source .github/versions.env
          echo "TRIVY_VERSION=$TRIVY_VERSION" >> "$GITHUB_ENV"
          echo "SPECMATIC_VERSION=$SPECMATIC_VERSION" >> "$GITHUB_ENV"

      - name: Run the local contract pipeline
        env:
          PIPELINE_TIMINGS_FILE: ${{ runner.temp }}/pipeline-timings.csv
        run: bash ./run.sh

      - name: Upload pipeline timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-timings
          path: ${{ runner.temp }}/pipeline-timings.csv
          if-no-files-found: warn

      # Scan built runtime images here; security.yml scans repository dependencies and configuration.
      - name: Scan application container image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oas-polycontract-app:latest
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v${{ env.TRIVY_VERSION }}
          trivy-config: .github/trivy.yaml
      - name: Scan WireMock container image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oas-polycontract-wiremock:latest
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v${{ env.TRIVY_VERSION }}
          trivy-config: .github/trivy.yaml

      - name: Scan Specmatic container image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: specmatic/specmatic:${{ env.SPECMATIC_VERSION }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v${{ env.TRIVY_VERSION }}
          trivy-config: .github/trivy.yaml

