name: contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract-examples:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned runtime and scanner versions
        run: |
          source .github/versions.env
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
          echo "NPM_VERSION=$NPM_VERSION" >> "$GITHUB_ENV"
          echo "NODE_TEST_IMAGE=$NODE_TEST_IMAGE" >> "$GITHUB_ENV"
          echo "WIREMOCK_VERSION=$WIREMOCK_VERSION" >> "$GITHUB_ENV"
          echo "WIREMOCK_RUNTIME_IMAGE=$WIREMOCK_RUNTIME_IMAGE" >> "$GITHUB_ENV"
          echo "WIREMOCK_SHA256=$WIREMOCK_SHA256" >> "$GITHUB_ENV"
          echo "TRIVY_VERSION=$TRIVY_VERSION" >> "$GITHUB_ENV"
          echo "SPECMATIC_VERSION=$SPECMATIC_VERSION" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Download and verify WireMock runtime artifact
        id: wiremock_jar
        run: |
          artifact="$RUNNER_TEMP/oas-polycontract/wiremock-standalone-${WIREMOCK_VERSION}.jar"
          mkdir -p "$(dirname "$artifact")"
          curl --fail --location --retry 3 --output "$artifact" \
            "https://repo.maven.apache.org/maven2/org/wiremock/wiremock-standalone/${WIREMOCK_VERSION}/wiremock-standalone-${WIREMOCK_VERSION}.jar"
          printf '%s  %s\n' "$WIREMOCK_SHA256" "$artifact" | sha256sum --check

      - name: Check shell syntax
        run: bash -n run.sh pipeline/client-suite.sh

      - name: Check pipeline JavaScript syntax
        run: |
          node --check pipeline/run.mjs
          node --check evals/run.mjs

      - name: Run the local contract pipeline
        env:
          PIPELINE_TIMINGS_FILE: ${{ runner.temp }}/pipeline-timings.csv
        run: bash ./run.sh

      - name: Upload pipeline timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-timings
          path: ${{ runner.temp }}/pipeline-timings.csv
          if-no-files-found: warn

      # Scan the pinned upstream runtimes used by the demo; security.yml scans repository dependencies and configuration.
      - name: Scan application container image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.NODE_TEST_IMAGE }}:${{ env.NODE_VERSION }}-npm${{ env.NPM_VERSION }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v${{ env.TRIVY_VERSION }}
          trivy-config: .github/trivy.yaml
      - name: Scan WireMock container image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WIREMOCK_RUNTIME_IMAGE }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v${{ env.TRIVY_VERSION }}
          trivy-config: .github/trivy.yaml

      - name: Scan WireMock standalone artifact
        if: always() && steps.wiremock_jar.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/oas-polycontract/wiremock-standalone-${{ env.WIREMOCK_VERSION }}.jar
          format: table
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v${{ env.TRIVY_VERSION }}
          trivy-config: .github/trivy.yaml

      - name: Scan Specmatic container image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: specmatic/specmatic:${{ env.SPECMATIC_VERSION }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v${{ env.TRIVY_VERSION }}
          trivy-config: .github/trivy.yaml

