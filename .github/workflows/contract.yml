name: contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-examples:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker on macOS
        if: runner.os == 'macOS'
        run: |
          brew install colima docker docker-compose
          colima start --runtime docker --cpus 4 --memory 8 --disk 30

          for attempt in {1..30}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          echo "Docker did not become ready on the Colima VM" >&2
          docker info

      - name: Check shell syntax
        run: bash -n run.sh

      - name: Run the local contract pipeline
        run: bash ./run.sh

      - name: Scan application container image
        if: always() && runner.os == 'Linux'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oas-polycontract-app:latest
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan WireMock container image
        if: always() && runner.os == 'Linux'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oas-polycontract-wiremock:latest
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan Specmatic container image
        if: always() && runner.os == 'Linux'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: specmatic/specmatic:2.56.1
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Stop Colima
        if: always() && runner.os == 'macOS'
        run: |
          if command -v colima >/dev/null 2>&1; then
            colima stop || true
          fi
