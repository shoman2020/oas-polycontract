name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract-examples:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare contract runner
        uses: ./.github/actions/prepare-contract-runner

      - name: Download and verify WireMock runtime artifact
        id: wiremock_jar
        run: |
          artifact="$RUNNER_TEMP/oas-polycontract/wiremock-standalone-${WIREMOCK_VERSION}.jar"
          mkdir -p "$(dirname "$artifact")"
          curl --fail --location --connect-timeout 15 --max-time 60 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 90 --output "$artifact" \
            "https://repo.maven.apache.org/maven2/org/wiremock/wiremock-standalone/${WIREMOCK_VERSION}/wiremock-standalone-${WIREMOCK_VERSION}.jar"
          printf '%s  %s\n' "$WIREMOCK_SHA256" "$artifact" | sha256sum --check

      - name: Run shared contract gates
        env:
          NODE_TEST_IMAGE_ARCHIVE: ${{ runner.temp }}/oas-polycontract/node-test.tar
          POLYCONTRACT_PIPELINE_PROFILE: core
          PIPELINE_TIMINGS_FILE: ${{ runner.temp }}/pipeline-timings-core.csv
        run: bash ./run.sh

      - name: Upload core pipeline timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-timings-core
          path: ${{ runner.temp }}/pipeline-timings-core.csv
          if-no-files-found: warn

      # Scan pinned shared runtimes once; each language suite has its own isolated Testcontainers network.
      - name: Scan prepared Node test runtime archive
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/oas-polycontract/node-test.tar
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v${{ env.TRIVY_VERSION }}
          trivy-config: .github/trivy.yaml
      - name: Scan WireMock container image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WIREMOCK_RUNTIME_IMAGE }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v${{ env.TRIVY_VERSION }}
          trivy-config: .github/trivy.yaml

      - name: Scan WireMock standalone artifact
        if: always() && steps.wiremock_jar.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/oas-polycontract/wiremock-standalone-${{ env.WIREMOCK_VERSION }}.jar
          format: table
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v${{ env.TRIVY_VERSION }}
          trivy-config: .github/trivy.yaml

      - name: Scan Specmatic container image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: specmatic/specmatic:${{ env.SPECMATIC_VERSION }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v${{ env.TRIVY_VERSION }}
          trivy-config: .github/trivy.yaml

  native-api-suites:
    name: Native API suite (${{ matrix.client }})
    needs: contract-examples
    strategy:
      fail-fast: false
      matrix:
        client: [rust, go, python, js, ts, java, csharp, playwright]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare contract runner
        uses: ./.github/actions/prepare-contract-runner

      - name: Run native API suite
        env:
          POLYCONTRACT_PIPELINE_PROFILE: native
          POLYCONTRACT_NATIVE_CLIENTS: ${{ matrix.client }}
          PIPELINE_TIMINGS_FILE: ${{ runner.temp }}/pipeline-timings-${{ matrix.client }}.csv
        run: bash ./run.sh

      - name: Upload stack timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-timings-${{ matrix.client }}
          path: ${{ runner.temp }}/pipeline-timings-${{ matrix.client }}.csv
          if-no-files-found: warn
