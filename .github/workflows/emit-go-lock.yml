name: Emit Go lock manifest

on:
  push:
    branches: [codex/go-lock-generation]
    paths:
      - .github/workflows/emit-go-lock.yml

permissions:
  contents: read

jobs:
  emit:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Go module locks with pinned Go
        shell: bash
        run: |
          set -euo pipefail
          source .github/versions.env
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/clients/go:/workspace" \
            --workdir /workspace \
            "golang:${GO_VERSION}-alpine" go mod tidy
          for file in go.mod go.sum; do
            printf '\nLOCK_BEGIN:%s\n' "$file"
            base64 --wrap=0 "clients/go/$file"
            printf '\nLOCK_END:%s\n' "$file"
          done
