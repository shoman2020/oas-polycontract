name: Generate dependency locks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-lockfiles.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Rust, Go, and NuGet lock files
        shell: bash
        run: |
          set -euo pipefail
          source .github/versions.env

          docker run --rm \
            --volume "$GITHUB_WORKSPACE/clients/rust:/workspace" \
            --workdir /workspace \
            "rust:${RUST_VERSION}-bookworm" \
            bash -euc 'cargo generate-lockfile; cargo fetch --locked'

          docker run --rm \
            --volume "$GITHUB_WORKSPACE/clients/go:/workspace" \
            --workdir /workspace \
            "golang:${GO_VERSION}-alpine" \
            go mod tidy

          docker run --rm \
            --volume "$GITHUB_WORKSPACE/clients/csharp:/workspace" \
            --workdir /workspace \
            "mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}" \
            dotnet restore ContractTests.csproj --use-lock-file

          for lock_file in \
            clients/rust/Cargo.lock \
            clients/go/go.sum \
            clients/csharp/packages.lock.json; do
            test -s "$lock_file"
            printf '\nLOCKFILE_BEGIN:%s\n' "$lock_file"
            base64 --wrap=0 "$lock_file"
            printf '\nLOCKFILE_END:%s\n' "$lock_file"
          done
