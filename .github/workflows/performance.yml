name: performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  five-run-sample:
    name: Five-run sample (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned runtime versions
        run: |
          source .github/versions.env
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
          echo "NPM_VERSION=$NPM_VERSION" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Check shell syntax
        run: bash -n run.sh

      - name: Check Testcontainers runner syntax
        run: node --check pipeline/run.mjs

      - name: Collect one cold and four warm runs
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          sample_dir="$RUNNER_TEMP/oas-performance/$RUNNER_LABEL"
          mkdir -p "$sample_dir"
          for run in 1 2 3 4 5; do
            if [[ "$run" == 1 ]]; then
              echo "==> Cold pipeline sample $run of 5"
            else
              echo "==> Warm pipeline sample $run of 5"
            fi
            PIPELINE_TIMINGS_FILE="$sample_dir/run-$run.csv" bash ./run.sh
          done

      - name: Summarize the samples
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: node evals/summarize-performance.mjs "$RUNNER_TEMP/oas-performance/${{ matrix.runner }}"

      - name: Upload timing samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-performance-${{ matrix.runner }}
          path: ${{ runner.temp }}/oas-performance/${{ matrix.runner }}/
          if-no-files-found: warn
